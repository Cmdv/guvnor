[package]
name = "gaffer"
version = "0.1.0"
edition = "2021"
description = "Spec-gated feature orchestrator: humans hold the gates, LLM lanes do the typing, evidence decides."
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[profile.release]
strip = true
