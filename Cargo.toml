[package]
name = "guvnor"
version = "0.1.0"
edition = "2021"
description = "Spec-gated feature orchestrator: humans hold the gates, LLM lanes do the typing, evidence decides."
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
# unstable-rendered-line-info = Paragraph::line_count, the only honest way to
# know how tall wrapped text ended up — scroll clamping needs it. Feature-gated
# upstream (ratatui#293), so a minor bump may rename it.
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml_edit = { version = "0.22", features = ["serde"] }

[profile.release]
strip = true
